# Project info
sonar.organization=vws
sonar.projectKey=nl-mgo-app-ios-private
sonar.projectName=nl-mgo-app-ios-private

# Info links shown in SonarCloud
sonar.links.homepage=https://github.com/minvws/nl-mgo-app-ios-private

# Encoding and language specific properties
sonar.sourceEncoding=UTF-8

# Analysis scoping
sonar.sources=Sources, Packages
sonar.tests=MGOTests

# Code coverage
# https://docs.sonarsource.com/sonarcloud/enriching/test-coverage/test-coverage-parameters/#swift-with-xcode-93
sonar.coverageReportPaths=fastlane/test_output/sonarqube-generic-coverage.xml

# Duplication exclusions
sonar.cpd.exclusions=

# Additional reports
sonar.swift.swiftLint.reportPaths=
