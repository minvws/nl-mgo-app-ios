# Syntax: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_15.3.app/Contents/Developer
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10
  
jobs:
  test:
    runs-on: macos-14
    name: Build & test
    timeout-minutes: 60
    steps:
      - name: Prestart the simulator # https://circleci.com/docs/2.0/testing-ios/#pre-starting-the-simulator
        # 🧐 when changing below, don't forget to also change the device name in the Fastfile too: 
        run: | 
          xcrun simctl boot "iPhone 15 Pro" || true
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew
        run: |
          make homebrew_ci

      - name: Build mint dependencies
        uses: ./.github/actions/build-mint
      
      - name: Run SwiftLint 
        run: |
          make run_swiftlint

      - name: Checkout LFS resources
        run: |
          git lfs pull
          git checkout .

      - name: Generate project
        run: |
          make generate_project

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      
      - name: Build and test
        env:
          SLACK_URL: ${{ secrets.SLACK_URL }}
        run: |
          bundle exec fastlane ios test_ci

      - name: Convert Coverage
        run: |
          bash Scripts/xccov-to-sonarqube-generic.sh MGO.xcresult/ > sonarqube-generic-coverage.xml

      - name: Upload Coverage file
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sonarqube-generic-coverage-${{ github.run_number }}.xml
          path: sonarqube-generic-coverage.xml
     
  sonar:
    runs-on: ubuntu-22.04
    needs: test
    name: SonarCloud
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      - name: Download Coverage file
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-generic-coverage-${{ github.run_number }}.xml
          path: fastlane/test_output/sonarqube-generic-coverage.xml
          
      - name: Run SonarCloud scanner
        uses: SonarSource/sonarcloud-github-action@v2.1.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
