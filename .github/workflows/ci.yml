# Syntax: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10

jobs:
  test:
    runs-on: macos-26
    name: Build & test
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Homebrew
        run: |
          make homebrew_ci

      - name: Build mint dependencies
        uses: ./.github/actions/build-mint

      - name: Run SwiftLint
        run: |
          make run_swiftlint

      - name: Checkout LFS resources
        run: |
          git lfs pull
          git checkout .

      - name: Generate project
        env:
          MGO_BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USER }}
          MGO_BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          make generate_project

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Cache the SPM package checkouts that fastlane writes to ./SourcePackages.
      # The Fastfile sets `cloned_source_packages_path: "SourcePackages"` to keep
      # this at a predictable, project-relative path (the default is a content-
      # hashed directory inside ~/Library/Developer/Xcode/DerivedData).
      #
      # Cache key strategy:
      #   - Primary key: Xcode version + hash of every Package.resolved in the repo.
      #     A hit means packages are fully resolved; xcodebuild can skip network I/O.
      #   - Restore key: Xcode version only, so a partial hit (e.g. one new dep) is
      #     still useful — only the changed package is fetched from GitHub.
      - name: Restore SPM package cache
        uses: actions/cache@v5
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-

      # Cache Xcode's DerivedData build artifacts.
      # The Fastfile sets `derived_data_path: "DerivedData"` to keep this at a
      # stable path. On a full cache hit the ~4-minute compile step is reduced to
      # near-zero because Xcode's incremental build system reuses the cached .o
      # and .swiftmodule files. On a partial hit (source changed, deps unchanged)
      # Xcode still recompiles only the changed files.
      #
      # Cache key strategy:
      #   - Primary key: Xcode version + Package.resolved hash + Swift source hash.
      #     Guarantees a fully valid cache when nothing at all has changed.
      #   - Restore key 1: Xcode + Package.resolved — deps unchanged, source changed.
      #     Xcode recompiles only changed source files (incremental).
      #   - Restore key 2: Xcode only — deps and source changed, at minimum the
      #     pre-built SDKs and framework indexes are reused.
      - name: Restore DerivedData cache
        uses: actions/cache@v5
        with:
          path: DerivedData
          key: deriveddata-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            deriveddata-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}-
            deriveddata-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-

      # Resolve packages once before fastlane runs. fastlane's skip_package_repository_fetches
      # skips its own internal pre-resolve, so this is the only resolve call that hits
      # the network. xcodebuild build test reuses the already-resolved SourcePackages.
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "MGO Dev" \
            -project MGO.xcodeproj \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation

      - name: Build and test
        env:
          SLACK_URL: ${{ secrets.SLACK_URL }}
        run: |
          bundle exec fastlane ios test_ci

      - name: Convert Coverage
        run: |
          bash Scripts/xccov-to-sonarqube-generic.sh MGO.xcresult/ > coverage.xml

      - name: Upload Coverage file
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: coverage.xml
          path: coverage.xml

  sonar:
    runs-on: ubuntu-24.04
    needs: test
    name: SonarCloud
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Coverage file
        uses: actions/download-artifact@v8
        with:
          name: coverage.xml
          path: ./

      - name: Run SonarQube scan
        uses: minvws/action-sonarqube@v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          allow-run-on-dependabot: true
          allow-run-on-fork: true
