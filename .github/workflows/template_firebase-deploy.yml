# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
name: firebase-deploy-template

on:
  workflow_call:
    inputs:
      fastlane_command:
        required: true
        type: string
      app_title:
        required: true
        type: string
      app_filename:
        required: true
        type: string
    secrets:
      DIST_CERT_CONTENTS:
        required: true
      DIST_CERT_PASSWORD:
        required: true
      FIREBASE_TOKEN:
        required: true
      SLACK_URL:
        required: true
      BASIC_AUTH_USER:
        required: true
      BASIC_AUTH_PASSWORD:
        required: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10

jobs:
  template_firebase-deploy:
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Log Build Number
      run: |
        ./Scripts/log-build-number.sh

    - name: Load certificate
      env:
        CERTIFICATE_CONTENTS: ${{ secrets.DIST_CERT_CONTENTS }}
      run: |
        mkdir fastlane/certificates
        echo "$CERTIFICATE_CONTENTS" | base64 --decode > fastlane/certificates/distribution.p12

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Setup Homebrew
      run: |
        make homebrew_ci

    - name: Build mint dependencies
      uses: ./.github/actions/build-mint

    - name: Checkout LFS resources
      run: |
        git lfs pull
        git checkout .

    - name: Generate project
      env:
        MGO_BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USER }}
        MGO_BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
      run: |
        make generate_project

#    - name: Setup Imagemagick for icon overlays
#      run: |
#        make homebrew_ci_imagemagick

    # SPM packages are the same regardless of build configuration, so this cache
    # is shared with the ci.yml key (same Package.resolved hash). On a warm cache
    # the ~2-min GitHub network fetch is skipped entirely.
    # DerivedData is intentionally NOT cached here: release/distribution builds
    # produce different artifacts than the Debug test build in ci.yml, making a
    # shared cache useless, and deploys are too infrequent to stay warm on their own.
    - name: Restore SPM package cache
      uses: actions/cache@v5
      with:
        path: SourcePackages
        key: spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-

    - name: Resolve packages
      run: |
        xcodebuild -resolvePackageDependencies \
          -scheme "MGO Dev" \
          -project MGO.xcodeproj \
          -clonedSourcePackagesDirPath SourcePackages \
          -skipPackagePluginValidation

    - name: Build and deploy
      timeout-minutes: 45
      env:
        CERTIFICATE_PATH: fastlane/certificates/distribution.p12
        CERTIFICATE_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        SLACK_URL: ${{ secrets.SLACK_URL }}
        GITBRANCH: ${{ github.ref }}
      run: |
        ${{ inputs.fastlane_command }}

    - name: Archive App
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.app_title }}
        path: ${{ inputs.app_filename }}.ipa
        retention-days: 10

    - name: Archive dSYMs
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.app_title }} dSYMs
        path: ${{ inputs.app_filename }}.app.dSYM.zip
        retention-days: 10
