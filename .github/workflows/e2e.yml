# Syntax: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: E2E

on:
  schedule:
    - cron: "10 4 * * 4"
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
  FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 180
  FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 10
  
jobs:
  test:
    runs-on: macos-26
    name: Build & run end to end tests
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Homebrew
        run: |
          make homebrew_ci

      - name: Build mint dependencies
        uses: ./.github/actions/build-mint

      - name: Checkout LFS resources
        run: |
          git lfs pull
          git checkout .

      - name: Generate project
        env:
          MGO_BASIC_AUTH_USERNAME: ${{ secrets.BASIC_AUTH_USER }}
          MGO_BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
        run: |
          make generate_project

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          
      - name: Set TimeZone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneMacos: "Europe/Amsterdam"

      # SPM and DerivedData caches use the same key strategy as ci.yml.
      # E2E uses a different scheme ("MGO UI Tests") so its DerivedData
      # artifacts don't overlap with the unit-test job — hence the e2e prefix.
      - name: Restore SPM package cache
        uses: actions/cache@v5
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-

      - name: Restore DerivedData cache
        uses: actions/cache@v5
        with:
          path: DerivedData
          key: e2e-deriveddata-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}-${{ hashFiles('**/*.swift', 'project.yml') }}
          restore-keys: |
            e2e-deriveddata-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('**/Package.resolved') }}-
            e2e-deriveddata-${{ runner.os }}-${{ env.DEVELOPER_DIR }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -scheme "MGO UI Tests" \
            -project MGO.xcodeproj \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath SourcePackages \
            -skipPackagePluginValidation

      - name: Build and run e2e tests
        env:
          SLACK_URL: ${{ secrets.SLACK_URL }}
        run: |
          bundle exec fastlane ios e2e_ci

      - name: Archive test artifacts
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: test-output
          path: |
            fastlane/test_output/
            ~/Library/Developer/Xcode/DerivedData/MGO*/Logs/Test/*.xcresult

