      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Amsterdam

  - package-ecosystem: "swift"
    directory: "/Packages/MGOTest"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Amsterdam

  - package-ecosystem: "swift"
    directory: "/Packages/MGOUI"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Amsterdam

  - package-ecosystem: "swift"
    directory: "/Packages/Managers"
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Amsterdam
