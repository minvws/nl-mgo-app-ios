# Defines the Xcode Project, which can be generated by running `make generate_project`
# Specification: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: MDRF

# - Packages:

packages:
  Nimble:
    github: Quick/Nimble
    majorVersion: 13.1.2
  SnapshotTesting:
    github: pointfreeco/swift-snapshot-testing
    majorVersion: 1.15.1

# - Attributes:

attributes:
  LastUpgradeCheck: "1500"

# - Configurations:

configs:
  Development: debug
  FirebaseAcceptance: release
  FirebaseTest: release
  FirebaseProduction: release # should be identical to AppStore build.
  AppStore: release

fileGroups:
  - project.yml
  - .github
  - fastlane
  - Scripts
  - README.md

# - Project Level settings:

options:
  developmentLanguage: nl

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
    VERSIONING_SYSTEM: apple-generic
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(PROJECT_DIR)"
    LD_RUNPATH_SEARCH_PATHS:
      - "$(inherited)"
      - "@executable_path/Frameworks"

# - Target Templates (i.e. shared default settings for targets):

targetTemplates:

  Standard_BaseSettings:
    info:
      properties:
        # Dynamic properties (APP_FLAVOR etc) here are set at build time, so can still vary based on a Configuration.
        NETWORK_CONFIGURATION: $(NETWORK_CONFIGURATION)
        LOG_LEVEL: ${LOG_LEVEL}
        UILaunchScreen:
    settings:
      base:
        VALIDATE_PRODUCT: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym # Firebase warns that this must be set for all targets.
        ENABLE_BITCODE: false # because it's deprecated
      configs:
        Development:
          NETWORK_CONFIGURATION: DEV
          VALIDATE_PRODUCT: NO
          LOG_LEVEL: debug
        FirebaseAcceptance:
          NETWORK_CONFIGURATION: ACC
          LOG_LEVEL: error
          SWIFT_OPTIMIZE_OBJECT_LIFETIME: true
        FirebaseTest:
          NETWORK_CONFIGURATION: TEST
          LOG_LEVEL: debug
          SWIFT_OPTIMIZE_OBJECT_LIFETIME: true
        FirebaseProduction:
          NETWORK_CONFIGURATION: Production
          LOG_LEVEL: error
          SWIFT_OPTIMIZE_OBJECT_LIFETIME: true
        AppStore:
          NETWORK_CONFIGURATION: Production
          LOG_LEVEL: error
          SWIFT_OPTIMIZE_OBJECT_LIFETIME: true

  Standard_Signing:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: iPhone Distribution
        DEVELOPMENT_TEAM: C2H38GV99H
      configs:
        Development:
          CODE_SIGN_IDENTITY: iPhone Developer
        FirebaseAcceptance:
        FirebaseTest:
        FirebaseProduction:
        AppStore:
        
  Standard_iOS:
    platform: iOS
    type: application
#    dependencies:
#      # SPM:
#      - package: Resources
#      - package: ReusableUI
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1 # needs to be present for project to build locally, but is overwritten by fastlane. No need to change.
        TARGETED_DEVICE_FAMILY: 1,2 # iPhone + iPad
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_MODULE_NAME: MDRF
    info:
      properties:
        CFBundleDevelopmentRegion: nl_NL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: ${DISPLAY_NAME}
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - 'https'
          - 'googlechromes'
          - 'opera-https'
          - 'firefox'
          - 'microsoft-edge-https'
        LSRequiresIPhoneOS: true
        UIAppFonts:
          - 'ROsanswebtextregular.ttf'
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Run SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin" # for M1 macs

          if mint list | grep -q 'SwiftLint'; then
            mint run swiftlint --quiet --config=./.swiftlint.yml
          else
            echo "warning: SwiftLint not found, run 'make dev' in the project root folder"
          fi

  Standard_UnitTesting:
    platform: iOS
    type: bundle.unit-test
    dependencies:
      - package: Nimble
      - package: SnapshotTesting
    settings:
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MDRF.app/MDRF"

  Standard_UITesting:
    platform: iOS
    type: bundle.ui-testing
    dependencies:
      - target: MDRF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

# - Targets

targets:
  MDRF:
    # scheme:
    #   testTargets:
    templates:
      - Standard_iOS
      - Standard_Signing
      - Standard_BaseSettings
    sources:
      - path: Sources/MDRF
        
    settings:
      base:
        # keep the comment on the next line, as it shows up in the CI logs & helps distinguish
        MARKETING_VERSION: 0.0.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/MDRF/Info.plist

      configs:
        Development:
          DISPLAY_NAME: "🤖 Dev Mijn Zorg"
          PRODUCT_NAME: MDRF
          PRODUCT_BUNDLE_IDENTIFIER: nl.rijksoverheid.mdrf.dev
          # PROVISIONING_PROFILE_SPECIFIER: CoronaCheck Holder Dev
          # CODE_SIGN_ENTITLEMENTS: Sources/CTR/Configuration/Holder-Dev.entitlements
        FirebaseTest:
          DISPLAY_NAME: "🧪 Test Mijn Zorg"
          PRODUCT_NAME: MDRF Test
          PRODUCT_BUNDLE_IDENTIFIER: nl.rijksoverheid.mdrf.test
          # PROVISIONING_PROFILE_SPECIFIER: CoronaCheck Holder Test
          # CODE_SIGN_ENTITLEMENTS: Sources/CTR/Configuration/Holder-Test.entitlements
        FirebaseAcceptance:
          DISPLAY_NAME: "💡 Acc Mijn Zorg"
          PRODUCT_NAME: MDRF ACC
          PRODUCT_BUNDLE_IDENTIFIER: nl.rijksoverheid.mdrf.acc
          # PROVISIONING_PROFILE_SPECIFIER: CoronaCheck Holder Acc
          # CODE_SIGN_ENTITLEMENTS: Sources/CTR/Configuration/Holder-Acc.entitlements
        FirebaseProduction:
          DISPLAY_NAME: "Mijn Zorg"
          PRODUCT_NAME: MDRF PROD
          PRODUCT_BUNDLE_IDENTIFIER: nl.rijksoverheid.mdrf
#           PROVISIONING_PROFILE_SPECIFIER: CoronaCheck Holder Prod
#           CODE_SIGN_ENTITLEMENTS: Sources/CTR/Configuration/Holder-Prod.entitlements
        AppStore:
          DISPLAY_NAME: "Mijn Zorg"
          PRODUCT_NAME: MDRF
          PRODUCT_BUNDLE_IDENTIFIER: nl.rijksoverheid.mdrf
#           PROVISIONING_PROFILE_SPECIFIER: CoronaCheck Holder AppStore
#           CODE_SIGN_ENTITLEMENTS: Sources/CTR/Configuration/Holder-Prod.entitlements
    info:
      path: Sources/MDRF/Info.plist
#      properties:
#        CFBundleURLTypes:
#            - CFBundleTypeRole: Editor
#              CFBundleURLName: nl.rijksoverheid.mdrf
#              CFBundleURLSchemes:
#                - coronacheck
#            - CFBundleTypeRole: Editor
#              CFBundleURLName: nl.rijksoverheid.mdrf.dev
#              CFBundleURLSchemes:
#                - coronacheck-dev
#            - CFBundleTypeRole: Editor
#              CFBundleURLName: nl.rijksoverheid.mdrf.test
#              CFBundleURLSchemes:
#                - coronacheck-test
#            - CFBundleTypeRole: Editor
#              CFBundleURLName: nl.rijksoverheid.mdrf.acc
#              CFBundleURLSchemes:
#                - coronacheck-acc
        # UILaunchStoryboardName: LaunchScreenHolder

  MDRFTests:
    templates:
      - Standard_UnitTesting
    sources:
      - path: MDRFTests
        excludes:
          - "**/__Snapshots__"

# - Scheme Templates

schemeTemplates:

  # Template for Development/Acc/Production/AppStore varieties
  ConfigScheme:
    build:
      config: ${configEnvironment} #not sure if needed.
      targets:
        ${appTargetName}: all
    test:
      config: ${configEnvironment}
    run:
      config: ${configEnvironment}
    profile:
      config: ${configEnvironment}
    analyze:
      config: ${configEnvironment}
    archive:
      config: ${configEnvironment}

  # Variant of the standard `ConfigScheme` for Development
  DevelopmentConfigScheme:
    templates:
      - ConfigScheme
    run:
      commandLineArguments:
        # Enable CoreData debug flags:
        # See: https://www.donnywals.com/using-launch-arguments-for-easier-core-data-debugging/
       # "-com.apple.CoreData.SQLDebug 2": YES # choose a level from 1-4
        "-com.apple.CoreData.ConcurrencyDebug 1": YES # crash with stacktrace on concurrency mistakes
        "-com.apple.CoreData.MigrationDebug 1": YES

  # Template for adding unit tests to a scheme:
  UnitTestScheme:
    test:
      commandLineArguments:
        "--unittesting": true
      language: nl
      region: NL
      gatherCoverageData: true
      coverageTargets:
        - ${appTargetName}

# - Schemes

schemes:
  MDRF Dev:
    templates:
      - DevelopmentConfigScheme
      - UnitTestScheme # This scheme has unit tests
    templateAttributes:
      appTargetName: MDRF
      configEnvironment: Development
    run:
      language: nl
    test:
      targets:
        - name: MDRFTests
          parallelizable: false
          randomExecutionOrder: true
    
  MDRF Acceptance:
    templates:
      - ConfigScheme
    templateAttributes:
      appTargetName: MDRF
      configEnvironment: FirebaseAcceptance
  
  MDRF Test:
    templates:
      - ConfigScheme
    templateAttributes:
      appTargetName: MDRF
      configEnvironment: FirebaseTest

  MDRF Production:
    templates:
      - ConfigScheme
    templateAttributes:
      appTargetName: MDRF
      configEnvironment: FirebaseProduction

  MDRF AppStore:
    templates:
      - ConfigScheme
    templateAttributes:
      appTargetName: MDRF
      configEnvironment: AppStore
